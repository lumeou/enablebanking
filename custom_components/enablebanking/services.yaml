    date_to: {required: false, selector: {date: }}
    direction: {required: false, selector: {select: {options: ["income", "expense"]}}}
    min_amount: {required: false, selector: {number: {min: 0, step: 0.01, mode: box}}}
    max_amount: {required: false, selector: {number: {min: 0, step: 0.01, mode: box}}}
    text: {required: false, selector: {text: }}
    category: {required: false, selector: {text: }}
    include_pending: {required: false, default: false, selector: {boolean: }}
    limit: {required: false, default: 50, selector: {number: {min: 1, max: 500, mode: box}}}
    offset: {required: false, default: 0, selector: {number: {min: 0, mode: box}}}
    order: {required: false, default: desc, selector: {select: {options: ["asc", "desc"]}}}

get_summary:
  fields:
    account_iban: {required: false, selector: {text: }}
